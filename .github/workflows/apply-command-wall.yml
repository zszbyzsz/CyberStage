name: Integrate cinematic command wall

on:
  push:
    branches:
      - feat/cinematic-command-wall
    paths:
      - ".bootstrap/command-wall-part-*"
      - ".github/workflows/apply-command-wall.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cinematic-command-wall

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify and install command wall sources
        shell: bash
        run: |
          set -euo pipefail
          echo "48c55ba85e86430f1a3518a3ff2f41b00cd313d17f227fc292eb9dc349ab25f0  .bootstrap/command-wall-part-000-aa" | sha256sum --check --strict
          echo "f1152db3fa4eecb159e4d898c2d3e6f5d6cf683291e067e15fe4e7b7fdbaa343  .bootstrap/command-wall-part-000-b0" | sha256sum --check --strict
          echo "d32a5db74619dd937ab20ef48e85d6a7f0982b36705a3cf9e3039f47bfdf46c0  .bootstrap/command-wall-part-000-b1" | sha256sum --check --strict
          echo "58c5005fae00c933ef072e976be85adb3d4a004c3844745041cf6214a4b4ebb9  .bootstrap/command-wall-part-000-b2" | sha256sum --check --strict
          echo "b5f4b322e4936b6573ada78b0e2d4df15a2d0dbf32ba716920c4d2743d00b4c0  .bootstrap/command-wall-part-000-b3" | sha256sum --check --strict
          echo "f20716685d4b303c22dce7499b37dd96a3ec5bd57641ad1f037040b5ca3cae2a  .bootstrap/command-wall-part-000-b4" | sha256sum --check --strict
          echo "ced0f5afdebb3e4156ae7dd47965de58479d492b23a4388d7f55f621560a4bdc  .bootstrap/command-wall-part-000-b5" | sha256sum --check --strict
          echo "1f0b93d4557a0155846ec346f8984614bf10f1e98a9cb66659d34040cf033c6a  .bootstrap/command-wall-part-001" | sha256sum --check --strict
          echo "d7484271a09f9afc9636a4b79cec4544422bdc9b57127636be3e134464e9f0db  .bootstrap/command-wall-part-002" | sha256sum --check --strict
          cat \
            .bootstrap/command-wall-part-000-aa \
            .bootstrap/command-wall-part-000-b0 \
            .bootstrap/command-wall-part-000-b1 \
            .bootstrap/command-wall-part-000-b2 \
            .bootstrap/command-wall-part-000-b3 \
            .bootstrap/command-wall-part-000-b4 \
            .bootstrap/command-wall-part-000-b5 \
            .bootstrap/command-wall-part-001 \
            .bootstrap/command-wall-part-002 \
            > /tmp/command-wall.tar.gz.b64
          base64 --decode /tmp/command-wall.tar.gz.b64 > /tmp/command-wall.tar.gz
          echo "3759c18cc7aa1f3e1467d22bf34d178abbb8a001c62cd2ed0174b0570dafb322  /tmp/command-wall.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/command-wall.tar.gz > /tmp/command-wall-files.txt
          diff -u <(printf '%s\n' \
            docs/command-wall.md \
            index.html \
            src/command-wall.css \
            src/command-wall.js \
            src/ui/command-wall.js \
            tests/command-wall.test.js) <(sort /tmp/command-wall-files.txt)
          ! grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/command-wall-files.txt
          tar -xzf /tmp/command-wall.tar.gz

      - name: Update project discovery documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected marker count 1, found {text.count(old)}")
              file.write_text(text.replace(old, new))

          replace_once(
              "README.md",
              '  <a href="./docs/scene-catalogue.md">Scene catalogue</a>',
              '  <a href="./docs/scene-catalogue.md">Scene catalogue</a>\n  ·\n  <a href="./docs/command-wall.md">Command Wall</a>',
          )
          replace_once(
              "README.md",
              '- Enter **Broadcast Mode** for a clean full-screen shot suitable for video or projection.',
              '- Switch to the **Cinematic Command Wall** for a phase ladder, authority contest, protected-system lanes, detailed telemetry, and previous/current/next cue framing.\n- Enter **Broadcast Mode** for a clean full-screen shot suitable for video or projection.',
          )
          replace_once(
              "README.md",
              '| `F` | Toggle fullscreen |\n| `1`–`9` | Select a scene |',
              '| `F` | Toggle fullscreen |\n| `W` | Toggle Cinematic Command Wall |\n| `V` | Cycle Command Wall shots |\n| `1`–`9` | Select a scene |',
          )

          replace_once(
              "README.zh-CN.md",
              '  <a href="./docs/scene-catalogue.md">场景目录</a>',
              '  <a href="./docs/scene-catalogue.md">场景目录</a>\n  ·\n  <a href="./docs/command-wall.md">影视指挥大屏</a>',
          )
          replace_once(
              "README.zh-CN.md",
              '- **影视展示模式**：Broadcast Mode 会隐藏非必要面板，适合全屏录制、投屏或作为影视屏幕素材。',
              '- **影视指挥大屏**：在同一时间轴上切换阶段轨道、控制权争夺、受保护系统、细节遥测和前后镜头；Control Plane Eclipse、Cipher Furnace 与 Blackout Ledger 具备专属大屏。\n- **影视展示模式**：Broadcast Mode 会隐藏非必要面板，适合全屏录制、投屏或作为影视屏幕素材。',
          )
          replace_once(
              "README.zh-CN.md",
              '| `F` | 切换全屏 |\n| `1`–`9` | 快速切换场景 |',
              '| `F` | 切换全屏 |\n| `W` | 切换影视指挥大屏 |\n| `V` | 循环切换大屏镜头 |\n| `1`–`9` | 快速切换场景 |',
          )

          replace_once(
              "CHANGELOG.md",
              '## [Unreleased]\n\n### Added\n\n',
              '## [Unreleased]\n\n### Added\n\n- Cinematic Command Wall with synchronized topology/wall switching, phase navigation, manual and automatic camera shots, and deep-linkable wall state.\n- Dedicated large-screen treatments for Control Plane Eclipse, Cipher Furnace, and Blackout Ledger, plus a generic wall for every built-in scene.\n',
          )

      - name: Remove one-time assembly files
        run: rm -rf .bootstrap .github/workflows/apply-command-wall.yml

      - name: Validate complete project
        run: npm run check

      - name: Commit integrated command wall
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add cinematic command wall"
          git push origin HEAD:feat/cinematic-command-wall

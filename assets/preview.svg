<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CyberStage interface preview</title>
  <desc id="desc">A cinematic dark interface showing a synthetic network map, telemetry, event console, and director timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900">
      <stop stop-color="#020507"/>
      <stop offset=".52" stop-color="#071018"/>
      <stop offset="1" stop-color="#020609"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="50%">
      <stop stop-color="#62eef7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#62eef7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8bc7d4" stroke-opacity=".08"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .sans{font-family:Inter,system-ui,sans-serif}
      .panel{fill:#07151f;fill-opacity:.9;stroke:#89c2d3;stroke-opacity:.18}
      .muted{fill:#63808a}.text{fill:#d8edf2}.accent{fill:#62eef7}.green{fill:#68f0b0}.amber{fill:#ffc866}.red{fill:#ff4f75}
      .edge{fill:none;stroke:#62eef7;stroke-opacity:.45;stroke-width:2;stroke-dasharray:7 8}
      .edge-red{fill:none;stroke:#ff4f75;stroke-opacity:.8;stroke-width:3;stroke-dasharray:9 7}
      .node{fill:#071b26;stroke:#62eef7;stroke-width:2}.node-red{fill:#24101a;stroke:#ff4f75;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect x="0" y="0" width="1600" height="70" fill="#030a0f" stroke="#89c2d3" stroke-opacity=".18"/>
  <g transform="translate(24 14)">
    <path d="M22 0 42 12v24L22 48 2 36V12Z" fill="#071018" stroke="#62eef7" stroke-width="2"/>
    <path d="M29 15H19l-6 6v7l6 6h10M17 19h13l4 4-4 4h-9l-4 4 4 4h12" fill="none" stroke="#c2fbff" stroke-width="2.4"/>
  </g>
  <text x="82" y="34" class="mono text" font-size="18" font-weight="700" letter-spacing="4">CYBERSTAGE</text>
  <text x="82" y="50" class="mono accent" font-size="9" letter-spacing="3">DIRECT THE SIGNAL</text>
  <rect x="420" y="18" width="420" height="35" rx="5" fill="#091923" stroke="#89c2d3" stroke-opacity=".3"/>
  <text x="438" y="41" class="mono text" font-size="12">GHOST RELAY · SYNTHETIC INCIDENT</text>
  <text x="1290" y="39" class="mono green" font-size="11" letter-spacing="2">SIMULATION ONLY</text>
  <rect x="1440" y="20" width="128" height="30" rx="3" fill="#0c211b" stroke="#68f0b0" stroke-opacity=".5"/>
  <text x="1504" y="39" text-anchor="middle" class="mono green" font-size="10" letter-spacing="2">NOMINAL</text>

  <rect x="18" y="84" width="260" height="690" rx="10" class="panel"/>
  <rect x="290" y="84" width="975" height="540" rx="10" class="panel"/>
  <rect x="1277" y="84" width="305" height="690" rx="10" class="panel"/>
  <rect x="290" y="636" width="975" height="138" rx="10" class="panel"/>
  <rect x="0" y="792" width="1600" height="108" fill="#030a0f" stroke="#89c2d3" stroke-opacity=".18"/>

  <text x="38" y="116" class="mono accent" font-size="9" letter-spacing="3">SCENE BRIEF</text>
  <text x="38" y="153" class="sans text" font-size="26" font-weight="700">Ghost Relay</text>
  <text x="38" y="180" class="sans muted" font-size="12">A synthetic identity anomaly</text>
  <text x="38" y="198" class="sans muted" font-size="12">crosses the edge while the blue</text>
  <text x="38" y="216" class="sans muted" font-size="12">team races to contain it.</text>
  <line x1="38" y1="242" x2="252" y2="242" stroke="#89c2d3" stroke-opacity=".16"/>
  <text x="38" y="266" class="mono muted" font-size="9" letter-spacing="2">OBJECTIVE</text>
  <text x="38" y="291" class="sans text" font-size="11">Correlate the signal, isolate the</text>
  <text x="38" y="309" class="sans text" font-size="11">synthetic session, and restore trust.</text>
  <line x1="38" y1="342" x2="252" y2="342" stroke="#89c2d3" stroke-opacity=".16"/>
  <text x="38" y="369" class="mono accent" font-size="9" letter-spacing="2">SELECTED NODE</text>
  <text x="38" y="402" class="mono text" font-size="16" font-weight="700">SOC SEVEN</text>
  <rect x="38" y="432" width="96" height="58" fill="#030c12" stroke="#89c2d3" stroke-opacity=".16"/>
  <rect x="136" y="432" width="116" height="58" fill="#030c12" stroke="#89c2d3" stroke-opacity=".16"/>
  <text x="48" y="452" class="mono muted" font-size="8">ZONE</text><text x="48" y="475" class="mono text" font-size="10">DEFENSE</text>
  <text x="146" y="452" class="mono muted" font-size="8">ADDRESS</text><text x="146" y="475" class="mono text" font-size="10">203.0.113.70</text>

  <text x="312" y="116" class="mono accent" font-size="9" letter-spacing="3">SYNTHETIC NETWORK MAP</text>
  <text x="525" y="116" class="mono text" font-size="10" letter-spacing="2">CONTAIN</text>
  <rect x="304" y="132" width="947" height="430" fill="url(#grid)"/>
  <circle cx="778" cy="347" r="90" fill="none" stroke="#62eef7" stroke-opacity=".08" stroke-dasharray="4 8"/>
  <circle cx="778" cy="347" r="180" fill="none" stroke="#62eef7" stroke-opacity=".08" stroke-dasharray="4 8"/>
  <circle cx="778" cy="347" r="270" fill="none" stroke="#62eef7" stroke-opacity=".08" stroke-dasharray="4 8"/>

  <path d="M380 360 C470 360 470 260 555 260" class="edge-red"/>
  <path d="M555 260 C650 260 650 198 745 198" class="edge"/>
  <path d="M555 260 C680 260 680 400 800 400" class="edge-red"/>
  <path d="M745 198 C785 198 785 400 800 400" class="edge"/>
  <path d="M800 400 C900 400 900 280 1015 280" class="edge-red"/>
  <path d="M800 400 C915 400 915 485 1050 485" class="edge"/>
  <path d="M1050 485 C1110 485 1110 390 1190 390" class="edge"/>

  <g transform="translate(380 360)"><polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" class="node-red"/><text y="5" text-anchor="middle" class="mono text" font-size="10">GU</text></g>
  <g transform="translate(555 260)"><polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" class="node-red"/><text y="5" text-anchor="middle" class="mono text" font-size="10">ER</text></g>
  <g transform="translate(745 198)"><polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" class="node"/><text y="5" text-anchor="middle" class="mono text" font-size="10">IM</text></g>
  <g transform="translate(800 400)"><circle r="41" fill="none" stroke="#ff4f75" stroke-opacity=".7" stroke-dasharray="3 5" filter="url(#soft)"/><polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" class="node-red"/><text y="5" text-anchor="middle" class="mono text" font-size="10">SG</text></g>
  <g transform="translate(1015 280)"><polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" class="node-red"/><text y="5" text-anchor="middle" class="mono text" font-size="10">AV</text></g>
  <g transform="translate(1050 485)"><circle r="43" fill="none" stroke="#68f0b0" stroke-dasharray="3 5"/><polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#09251d" stroke="#68f0b0" stroke-width="2"/><text y="5" text-anchor="middle" class="mono text" font-size="10">S7</text></g>
  <g transform="translate(1190 390)"><polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" class="node"/><text y="5" text-anchor="middle" class="mono text" font-size="10">FB</text></g>
  <circle cx="878" cy="376" r="8" class="red" filter="url(#soft)"/><circle cx="878" cy="376" r="2.5" fill="#fff"/>
  <text x="322" y="590" class="mono muted" font-size="9" letter-spacing="2">DIRECTOR CAPTION</text>
  <text x="485" y="590" class="mono text" font-size="11">The blue team chooses precision containment instead of shutting everything down.</text>

  <text x="1299" y="116" class="mono accent" font-size="9" letter-spacing="3">TELEMETRY</text>
  <g transform="translate(1299 138)">
    <rect width="126" height="96" fill="#030c12" stroke="#89c2d3" stroke-opacity=".16"/><text x="12" y="20" class="mono muted" font-size="8">THREAT INDEX</text><text x="112" y="24" text-anchor="end" class="mono text" font-size="20">69</text><rect x="12" y="38" width="102" height="3" fill="#1c2a31"/><rect x="12" y="38" width="70" height="3" class="red"/><polyline points="12,78 30,74 48,68 66,52 84,42 104,55" fill="none" stroke="#ff4f75" stroke-width="2"/>
    <rect x="138" width="126" height="96" fill="#030c12" stroke="#89c2d3" stroke-opacity=".16"/><text x="150" y="20" class="mono muted" font-size="8">TRUST SCORE</text><text x="252" y="24" text-anchor="end" class="mono text" font-size="20">48</text><rect x="150" y="38" width="102" height="3" fill="#1c2a31"/><rect x="150" y="38" width="49" height="3" class="green"/><polyline points="150,50 168,53 186,57 204,72 222,76 242,67" fill="none" stroke="#68f0b0" stroke-width="2"/>
  </g>
  <text x="1299" y="275" class="mono accent" font-size="9" letter-spacing="3">INCIDENT CUES</text>
  <g class="mono" font-size="9">
    <rect x="1299" y="294" width="264" height="65" fill="#0a1b24"/><rect x="1299" y="304" width="2" height="28" class="red"/><text x="1312" y="313" class="muted">00:45.0</text><text x="1370" y="313" class="text" font-weight="700">Containment cue accepted</text><text x="1370" y="333" class="muted">SOC isolates the fictional session.</text>
    <line x1="1299" y1="369" x2="1563" y2="369" stroke="#89c2d3" stroke-opacity=".12"/>
    <text x="1312" y="392" class="muted">00:34.0</text><text x="1370" y="392" class="text">Vault trust gate refuses session</text><text x="1370" y="411" class="muted">Record access count remains zero.</text>
    <line x1="1299" y1="435" x2="1563" y2="435" stroke="#89c2d3" stroke-opacity=".12"/>
    <text x="1312" y="458" class="muted">00:24.0</text><text x="1370" y="458" class="text">Service path illuminated</text><text x="1370" y="477" class="muted">Correlation promoted to the room.</text>
  </g>
  <rect x="1299" y="664" width="264" height="86" fill="#071913" stroke="#68f0b0" stroke-opacity=".35"/>
  <text x="1315" y="691" class="mono green" font-size="10" font-weight="700">SAFE BY CONSTRUCTION</text>
  <text x="1315" y="715" class="sans muted" font-size="10">No transport, scanning, command</text><text x="1315" y="731" class="sans muted" font-size="10">execution, or live targeting.</text>

  <text x="310" y="663" class="mono muted" font-size="9">● ● ●  STAGE EVENT CONSOLE</text>
  <g class="mono" font-size="9">
    <text x="310" y="692" class="muted">00:45.0</text><text x="382" y="692" class="accent">SOC</text><text x="455" y="692" class="text">containment cue signed · case=CS-091 · mode=simulation</text>
    <text x="310" y="714" class="muted">00:45.0</text><text x="382" y="714" class="amber">EDGE</text><text x="455" y="714" class="text">session moved to inert replay lane · traffic unaffected</text>
    <text x="310" y="736" class="muted">00:34.0</text><text x="382" y="736" class="red">VAULT</text><text x="455" y="736" class="text">trust gate denied · record access count=0</text>
  </g>

  <g transform="translate(24 826)">
    <rect width="72" height="34" rx="4" fill="#0a1d27" stroke="#89c2d3" stroke-opacity=".3"/><text x="36" y="22" text-anchor="middle" class="mono muted" font-size="9">RESET</text>
    <rect x="82" width="108" height="34" rx="4" fill="#102c35" stroke="#62eef7" stroke-opacity=".7"/><text x="136" y="22" text-anchor="middle" class="mono text" font-size="9">Ⅱ PAUSE</text>
  </g>
  <text x="246" y="848" class="mono text" font-size="12">00:45.0</text><text x="305" y="848" class="mono muted" font-size="12">/ 01:30.0</text>
  <line x1="410" y1="844" x2="1135" y2="844" stroke="#89c2d3" stroke-opacity=".24" stroke-width="3"/>
  <line x1="410" y1="844" x2="776" y2="844" stroke="#62eef7" stroke-width="3"/>
  <circle cx="776" cy="844" r="7" fill="#62eef7" filter="url(#soft)"/>
  <rect x="1270" y="826" width="130" height="34" rx="4" fill="#0a1d27" stroke="#89c2d3" stroke-opacity=".3"/><text x="1335" y="848" text-anchor="middle" class="mono muted" font-size="9">BROADCAST</text>
  <rect x="1410" y="826" width="158" height="34" rx="4" fill="#0a1d27" stroke="#89c2d3" stroke-opacity=".3"/><text x="1489" y="848" text-anchor="middle" class="mono muted" font-size="9">FULLSCREEN</text>
</svg>
